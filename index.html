<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

<div class="container fluid">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <h2>Student</h2>
            <p>ResearchDesk</p>
        </div>

        <nav>
            <a class="active"><i class="fa-solid fa-desktop"></i> Dashboard</a>
            <a><i class="fa-solid fa-clipboard"></i> Proposal</a>
            <a><i class="fa-solid fa-upload"></i> Upload</a>
            <a><i class="fa-solid fa-star"></i> Review</a>
        </nav>
        <br> <br> <br> <br> <br> <br>
        <div class="logout"><i class="fa-solid fa-right-from-bracket"></i> Log out</div>
    </aside>

    <!-- Main -->
    <main class="main">

        <!-- Topbar -->
        <div class="topbar">
            <div class="search">
                <input type="text" placeholder="Search...">
            </div>

            <div class="top-icons">
                <i class="fa-regular fa-moon" id="modeToggle"></i>
                <i class="fa-regular fa-bell"></i>
                <span>W.L Bhashitha</span>
            </div>
        </div>

        <!-- Cards -->
        <div class="cards">
            <div class="card">
                <i class="fa-solid fa-folder"></i>
                <div>
                    <h3>All Project</h3>
                    <p>38 project</p>
                </div>
            </div>

            <div class="card">
                <i class="fa-solid fa-file-arrow-up"></i>
                <div>
                    <h3>Submission</h3>
                    <p>3 Submitted</p>
                </div>
            </div>

            <div class="card">
                <i class="fa-solid fa-comments"></i>
                <div>
                    <h3>Feedback</h3>
                    <p>3 Comment</p>
                </div>
            </div>
        </div>

        <!-- Bottom -->
        <div class="bottom">

            <!-- Chart -->
            <div class="chart">
                <h3>Research Status</h3>
                <div class="circle"></div>
            </div>

            <!-- Feedback -->
            <div class="feedback">
                <h3>Recent Feedback</h3>

                <div class="item">
                    <span>Dr.Sumith</span>
                    <button>Comment</button>
                </div>

                <div class="item">
                    <span>Dr.Sumith</span>
                    <button>Comment</button>
                </div>

                <div class="item">
                    <span>Dr.Sumith</span>
                    <button>Comment</button>
                </div>

            </div>

        </div>

    </main>
</div>

<script src="script.js"></script>
</body>
</html>
